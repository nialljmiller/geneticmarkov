[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneticmarkov"
version = "0.0.1"
description = "An emcee-like hybrid genetic algorithm and DEMC sampler for black-box scientific models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Niall Miller"},
]
keywords = [
    "genetic algorithm",
    "differential evolution",
    "MCMC",
    "DEMC",
    "sampling",
    "optimization",
    "black-box models",
    "scientific computing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "deap>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.950",
]
plot = [
    "matplotlib>=3.4",
    "corner>=2.2",
]
hdf5 = [
    "h5py>=3.0",
]
legacy-gce = [
    "pandas>=1.3",
    "matplotlib>=3.4",
    "corner>=2.2",
    "seaborn>=0.11",
    "scikit-learn>=0.24",
]

[project.urls]
Homepage = "https://github.com/nialljmiller/geneticmarkov"
Documentation = "https://github.com/nialljmiller/geneticmarkov#readme"
Repository = "https://github.com/nialljmiller/geneticmarkov"
Issues = "https://github.com/nialljmiller/geneticmarkov/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geneticmarkov*", "mdf_gce*"]

[tool.setuptools.package-data]
mdf_gce = ["*.txt", "*.dat"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["geneticmarkov", "mdf_gce"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
